name: Lint and Tests
env:
  # Set to empty.
  ANDROID_HOME:

# Controls when the action will run.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Least privilege. This workflow only reads the repository; the token needs
# nothing else, and the repository default is `write`.
permissions:
  contents: read

jobs:
  # Run linter check. Only test code linters on latest version of Go.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Go 1.x
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - run: make lint

  # Run core-geth -specific tests, proving regression-safety and config interoperability.
  test-cg:
    name: Tests-CoreGeth
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Go 1.x
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - run: make test-coregeth

  # Run build and tests against latest-1 Go version.
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Go 1.x
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      # Several timing-sensitive tests -- TestAdjustIntervalClique,
      # TestAttachWelcome and TestRPCDiscover among them -- fail intermittently
      # under runner load, and this job is a required status check, so a flake
      # blocks every pull request until someone re-runs it by hand. One retry
      # absorbs that. It does not hide a regression: a real failure fails both
      # attempts and still reports red.
      - run: |
          make all
          make test || {
            echo "::warning::test suite failed; retrying once to absorb a flaky timing test"
            make test
          }
